spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_aps?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
logging:
  level:
    # 设置mybatis-plus的SQL日志级别
    com.baomidou.mybatisplus: DEBUG
    # 设置你的项目包的日志级别
#    com.ecommerce: DEBUG
    # 设置SQL执行日志
    org.apache.ibatis: DEBUG
    org.mybatis.spring: DEBUG
    # 显示SQL语句
    com.ecommerce.mapper: DEBUG