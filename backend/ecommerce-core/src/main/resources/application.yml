spring:
  datasource:
    url: jdbc:mysql://localhost:3306/db_aps?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  redis:
    host: 192.168.174.133
    port: 6379
    password: ""
    database: 1
    timeout: 3000ms
    connect-timeout: 3000ms
    lettuce:
      pool:
        max-active: 16
        max-idle: 8
        min-idle: 2
        max-wait: 3000ms
  rabbitmq:
    host: 106.15.77.8
    port: 5672
    username: traework
    password: traework123
    # 开启发送确认
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 手动确认
        acknowledge-mode: manual
        # 每次抓取1条，公平调度
        prefetch: 1
        # 重试配置
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 3000ms
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ecommerce.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
logging:
  level:
    # 设置mybatis-plus的SQL日志级别
    com.baomidou.mybatisplus: DEBUG
    # 认证拦截器日志
    com.ecommerce.interceptor: DEBUG
    # 设置SQL执行日志
    org.apache.ibatis: DEBUG
    org.mybatis.spring: DEBUG
    # 显示SQL语句
    com.ecommerce.mapper: DEBUG

jwt:
  secret: ${JWT_SECRET:TraeworkShopSecretKey2026}
  expiration: 86400000

springdoc:
  swagger-ui:
    url: /v3/api-docs

